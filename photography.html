<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Photography by Panictreehouseboy." />
  <title>!Photography!</title>
  <script type="module" crossorigin src="/assets/photography-Cc4H-jka.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/project-bIKyPWnZ.js">
  <link rel="stylesheet" crossorigin href="/assets/project-nlTTrzgI.css">
  <link rel="stylesheet" crossorigin href="/assets/photography-uV49-urN.css">
</head>
<body class="photography-page">
  <main class="wrap">
    <section class="box" aria-label="Photography">
      <div class="label photo-heading">Photography</div>
      <div class="photo-gallery" aria-label="Photographs"></div>
      <a class="gallery-manage" href="/photography-admin.html">Upload</a>
      <noscript><div class="meta">Please enable JavaScript to view the photography prototype.</div></noscript>
    </section>
  </main>
  <dialog class="map-dialog" aria-labelledby="map-title">
    <div class="map-topbar">
      <h2 class="map-title" id="map-title">Location</h2>
      <button class="map-close" type="button" aria-label="Close location map" autofocus>Close</button>
    </div>
    <div class="map-frame">
      <div class="map-canvas" aria-label="Photo location map"></div>
      <p class="map-status" role="status" hidden></p>
    </div>
  </dialog>
</body>
</html>
