<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>正负形自由画板</title>
  <meta name="description" content="一张可反相、去色和负冲检查的 p5.js 无限自由画板。">
  <script src="https://cdn.jsdelivr.net/npm/p5@2.3.1/lib/p5.min.js"></script>
  <style>
    /* UI 主题变量：统一控制界面的文字、面板、强调色、阴影与圆角。 */
    :root {
      --ink: #20231f;
      --muted: #777a72;
      --paper: #f3f1ea;
      --panel: rgba(255, 255, 252, .92);
      --line: rgba(32, 35, 31, .12);
      --accent: #ff5a3d;
      --accent-soft: #fff0eb;
      --shadow: 0 18px 55px rgba(28, 32, 26, .14), 0 2px 8px rgba(28, 32, 26, .08);
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      color: var(--ink);
      background: var(--paper);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }
    button, input, textarea { font: inherit; }
    button { color: inherit; }

    /* 画布层：固定铺满窗口；色彩检查滤镜只施加在 canvas，不影响控制 UI。 */
    #canvas-shell { position: fixed; inset: 0; }
    #canvas-shell canvas { display: block; transform-origin: center; transition: filter .18s ease; }

    /* 控制面板共用的半透明玻璃外观。 */
    .glass {
      background: var(--panel);
      border: 1px solid rgba(255,255,255,.78);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px) saturate(1.15);
      -webkit-backdrop-filter: blur(18px) saturate(1.15);
    }

    /* 顶部控制栏：品牌、撤销/重做、清空、保存状态、导入与导出。 */
    .topbar {
      position: fixed; z-index: 20; top: 18px; left: 18px; right: 18px;
      height: 58px; border-radius: 18px; display: flex; align-items: center;
      padding: 8px 10px 8px 15px; gap: 10px;
    }
    .brand { display: flex; align-items: center; gap: 11px; min-width: 210px; }
    .brand-mark {
      width: 35px; height: 35px; border-radius: 11px; flex: none;
      background: var(--ink); color: #fff; display: grid; place-items: center;
      font-weight: 800; letter-spacing: -.08em; font-size: 13px;
    }
    .brand-copy { min-width: 0; }
    .brand-title { font-size: 14px; font-weight: 750; letter-spacing: -.02em; }
    .brand-sub { color: var(--muted); font-size: 10px; margin-top: 1px; }
    .top-divider { width: 1px; height: 25px; background: var(--line); margin: 0 2px; }
    .spacer { flex: 1; }
    .icon-btn, .tool-btn, .mode-btn, .seg-btn, .action-btn {
      border: 0; background: transparent; cursor: pointer; transition: .16s ease;
    }
    .icon-btn {
      width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center;
      font-size: 17px; position: relative;
    }
    .icon-btn:hover, .seg-btn:hover { background: rgba(32,35,31,.06); }
    .icon-btn:active, .tool-btn:active, .action-btn:active { transform: scale(.96); }
    .icon-btn[disabled] { opacity: .3; cursor: default; }
    .icon-btn.danger:hover { color: #ce3f2b; background: #fff0ed; }
    .text-btn { width: auto; padding: 0 12px; gap: 7px; grid-auto-flow: column; font-size: 12px; font-weight: 650; }
    .save-state { display: flex; gap: 7px; align-items: center; font-size: 11px; color: var(--muted); padding: 0 8px; }
    .save-dot { width: 7px; height: 7px; border-radius: 50%; background: #58a96a; box-shadow: 0 0 0 4px rgba(88,169,106,.1); }

    /* 左侧绘图工具栏：当前工具使用深色高亮，悬停时显示快捷键提示。 */
    .toolbar {
      position: fixed; z-index: 20; left: 18px; top: 93px; width: 58px;
      padding: 8px; border-radius: 18px; display: flex; flex-direction: column; gap: 4px;
    }
    .tool-btn {
      width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center;
      font-size: 17px; font-weight: 700; position: relative;
    }
    .tool-btn:hover { background: rgba(32,35,31,.06); }
    .tool-btn.active { background: var(--ink); color: white; box-shadow: 0 7px 16px rgba(32,35,31,.18); }
    .tool-btn::after {
      content: attr(data-tip); position: absolute; left: 52px; top: 50%; transform: translateY(-50%) translateX(-3px);
      white-space: nowrap; padding: 6px 8px; border-radius: 7px; background: #242722; color: white;
      font-size: 10px; font-weight: 600; opacity: 0; pointer-events: none; transition: .15s ease;
    }
    .tool-btn:hover::after { opacity: 1; transform: translateY(-50%) translateX(0); }
    .tool-sep { height: 1px; background: var(--line); margin: 4px 5px; }

    /* 右侧空间检查器：反相总开关、负冲类型与去色开关。 */
    .inspector {
      position: fixed; z-index: 20; right: 18px; top: 93px; width: 248px;
      padding: 14px; border-radius: 20px;
    }
    .eyebrow { color: var(--muted); font-size: 10px; font-weight: 750; letter-spacing: .1em; text-transform: uppercase; }
    .inspect-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 11px; }
    .live-pill {
      display: flex; align-items: center; gap: 6px; border-radius: 99px; padding: 5px 8px;
      background: #f0f1ec; color: var(--muted); font-size: 10px; font-weight: 700;
    }
    .live-pill.on { background: #222521; color: white; }
    .live-pill i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .space-switch {
      width: 100%; height: 58px; border: 1px solid var(--line); border-radius: 14px; background: #fbfaf6;
      display: flex; align-items: center; justify-content: space-between; padding: 0 13px; cursor: pointer;
      transition: .18s ease; margin-bottom: 12px;
    }
    .space-switch:hover { border-color: rgba(32,35,31,.25); transform: translateY(-1px); }
    .space-switch.on { background: var(--ink); color: white; border-color: var(--ink); }
    .switch-copy { text-align: left; }
    .switch-title { font-size: 13px; font-weight: 750; }
    .switch-sub { margin-top: 2px; opacity: .58; font-size: 9px; }
    kbd {
      min-width: 47px; padding: 7px 9px; border: 1px solid rgba(32,35,31,.16); border-bottom-width: 3px;
      border-radius: 8px; background: white; color: var(--ink); font-size: 10px; font-weight: 750;
      box-shadow: inset 0 -1px rgba(0,0,0,.04);
    }
    .mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .mode-btn {
      min-height: 40px; padding: 7px 9px; border-radius: 11px; border: 1px solid var(--line);
      background: rgba(255,255,255,.5); text-align: left;
    }
    .mode-btn:hover { border-color: rgba(32,35,31,.3); }
    .mode-btn.active { border-color: var(--accent); background: var(--accent-soft); color: #b93824; }
    .mode-name { font-size: 11px; font-weight: 750; display: block; }
    .mode-desc { font-size: 8px; opacity: .58; display: block; margin-top: 2px; }
    .control-block { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
    .control-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 9px; }
    .control-label { font-size: 11px; font-weight: 650; }
    .desat-btn {
      width: 100%; border: 1px solid var(--line); background: transparent; border-radius: 11px;
      height: 36px; cursor: pointer; display: flex; justify-content: space-between; align-items: center;
      padding: 0 10px; font-size: 11px; font-weight: 650;
    }
    .desat-btn.on { background: #eeefeb; border-color: #b4b7ae; }
    .toggle-dot { width: 25px; height: 14px; border-radius: 99px; background: #d6d8d1; padding: 2px; transition: .18s; }
    .toggle-dot::before { content: ''; display: block; width: 10px; height: 10px; border-radius: 50%; background: white; transition: .18s; box-shadow: 0 1px 3px rgba(0,0,0,.18); }
    .desat-btn.on .toggle-dot { background: var(--ink); }
    .desat-btn.on .toggle-dot::before { transform: translateX(11px); }

    /* 底部绘制样式控件：颜色、笔触粗细和形状填充。 */
    .style-panel {
      position: fixed; z-index: 20; left: 91px; bottom: 18px; height: 54px;
      border-radius: 17px; padding: 7px 10px; display: flex; align-items: center; gap: 10px;
    }
    .color-wrap { width: 34px; height: 34px; position: relative; border-radius: 50%; overflow: hidden; border: 3px solid white; box-shadow: 0 0 0 1px var(--line); }
    .color-wrap input { position: absolute; inset: -7px; width: 50px; height: 50px; border: 0; padding: 0; cursor: pointer; }
    .width-wrap { display: flex; align-items: center; gap: 8px; }
    .width-wrap input { accent-color: var(--ink); width: 102px; }
    #sizeValue { min-width: 26px; color: var(--muted); font-size: 10px; font-variant-numeric: tabular-nums; }
    .fill-btn { height: 34px; padding: 0 10px; border: 1px solid var(--line); border-radius: 10px; background: transparent; cursor: pointer; font-size: 10px; font-weight: 700; }
    .fill-btn.active { background: var(--ink); color: #fff; }

    /* 右下缩放控件：缩小、显示/重置比例、放大。 */
    .zoom-panel {
      position: fixed; z-index: 20; right: 18px; bottom: 18px; height: 44px;
      border-radius: 14px; padding: 5px; display: flex; align-items: center; gap: 2px;
    }
    .seg-btn { border: 0; height: 34px; min-width: 34px; border-radius: 9px; background: transparent; cursor: pointer; font-weight: 700; }
    #zoomLabel { width: 52px; font-size: 10px; color: var(--muted); }

    /* 辅助反馈 UI：操作提示与短暂状态通知。 */
    .hint {
      position: fixed; z-index: 10; left: 50%; bottom: 25px; transform: translateX(-50%);
      color: rgba(32,35,31,.45); font-size: 10px; pointer-events: none; transition: opacity .3s;
    }
    .toast {
      position: fixed; z-index: 60; left: 50%; top: 92px; transform: translate(-50%, -8px);
      padding: 10px 14px; border-radius: 12px; color: white; background: rgba(28,31,27,.9);
      font-size: 11px; font-weight: 650; opacity: 0; pointer-events: none; transition: .22s ease;
      box-shadow: 0 9px 25px rgba(0,0,0,.16);
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* 文字/便签编辑浮层：双击对象后出现，可保存、取消或删除。 */
    .editor {
      position: fixed; z-index: 40; width: 280px; padding: 11px; border-radius: 17px; display: none;
    }
    .editor.open { display: block; }
    .editor textarea {
      display: block; resize: vertical; width: 100%; min-height: 92px; max-height: 220px;
      border: 1px solid var(--line); border-radius: 11px; padding: 10px; outline: none;
      color: var(--ink); background: #fffefb; user-select: text;
    }
    .editor textarea:focus { border-color: var(--ink); box-shadow: 0 0 0 3px rgba(32,35,31,.07); }
    .editor-actions { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
    .action-btn { height: 31px; border-radius: 9px; padding: 0 11px; font-size: 10px; font-weight: 700; background: #edece6; }
    .action-btn.primary { background: var(--ink); color: white; }
    .action-btn.delete { color: #bd3e2b; background: #fff0ec; margin-right: auto; }

    /* 导出菜单：由顶部“导出”按钮切换显示。 */
    .drop-menu {
      position: fixed; z-index: 50; top: 80px; right: 29px; width: 180px; padding: 7px;
      border-radius: 14px; display: none;
    }
    .drop-menu.open { display: block; }
    .drop-menu button { width: 100%; height: 36px; border: 0; background: transparent; border-radius: 9px; text-align: left; padding: 0 10px; cursor: pointer; font-size: 11px; }
    .drop-menu button:hover { background: rgba(32,35,31,.06); }

    /* 启动错误提示：p5.js 未成功载入时覆盖画板。 */
    .load-error {
      position: fixed; z-index: 100; inset: 0; background: #f3f1ea; display: none; place-items: center; padding: 30px; text-align: center;
    }
    .load-error div { max-width: 430px; }
    .load-error h1 { font-size: 24px; }
    .load-error p { color: var(--muted); line-height: 1.7; }

    /* 图片拖放遮罩：文件经过窗口时显示，pointer-events 保证不拦截投放。 */
    .drop-zone {
      position: fixed; z-index: 90; inset: 12px; border: 2px dashed rgba(255,255,255,.72);
      border-radius: 26px; display: grid; place-items: center; pointer-events: none;
      background: rgba(32,35,31,.76); color: white; opacity: 0; transform: scale(.99);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transition: .16s ease;
    }
    .drop-zone.show { opacity: 1; transform: scale(1); }
    .drop-card { text-align: center; padding: 30px; }
    .drop-icon {
      width: 66px; height: 66px; margin: 0 auto 16px; border-radius: 20px;
      display: grid; place-items: center; background: rgba(255,255,255,.14); font-size: 29px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.15);
    }
    .drop-title { font-size: 19px; font-weight: 780; letter-spacing: -.02em; }
    .drop-sub { margin-top: 6px; color: rgba(255,255,255,.62); font-size: 11px; }

    /* 响应式控制：窄屏时压缩或隐藏次要 UI，并重新安排浮动面板。 */
    @media (max-width: 820px) {
      .inspector { width: 212px; }
      .brand-sub, .save-state, .top-divider.hide-small { display: none; }
      .brand { min-width: 155px; }
    }
    @media (max-width: 650px) {
      .inspector { top: auto; bottom: 82px; right: 10px; width: 196px; max-height: 55vh; overflow: auto; }
      .topbar { left: 10px; right: 10px; top: 10px; }
      .toolbar { left: 10px; top: 82px; }
      .style-panel { left: 10px; bottom: 10px; }
      .zoom-panel { right: 10px; bottom: 10px; }
      .mode-grid { grid-template-columns: 1fr; }
      .brand { min-width: 0; }
      .brand-copy, .topbar .optional { display: none; }
      .hint { display: none; }
    }
  </style>
</head>
<body>
  <!-- p5.js 画布挂载点：所有绘制内容位于控制 UI 的下层。 -->
  <main id="canvas-shell" aria-label="无限画板"></main>

  <!-- 顶部控制栏：全局历史、文件和保存状态操作。 -->
  <header class="topbar glass">
    <div class="brand">
      <div class="brand-mark">±</div>
      <div class="brand-copy">
        <div class="brand-title">正负形自由画板</div>
        <div class="brand-sub">形状、留白与反相检查</div>
      </div>
    </div>
    <div class="top-divider hide-small"></div>
    <button class="icon-btn" id="undoBtn" title="撤销 (⌘Z)" aria-label="撤销">↶</button>
    <button class="icon-btn" id="redoBtn" title="重做 (⇧⌘Z)" aria-label="重做">↷</button>
    <button class="icon-btn danger optional" id="clearBtn" title="清空画板" aria-label="清空画板">⌫</button>
    <div class="spacer"></div>
    <div class="save-state optional"><span class="save-dot"></span><span id="saveText">已自动保存</span></div>
    <div class="top-divider optional"></div>
    <button class="icon-btn text-btn optional" id="importBtn" title="导入图片或画板备份">⇧ <span>导入</span></button>
    <button class="icon-btn text-btn" id="exportBtn" title="导出">⇩ <span>导出</span></button>
  </header>

  <!-- 左侧工具栏：data-tool 会由 JavaScript 映射到当前绘制工具。 -->
  <nav class="toolbar glass" aria-label="绘图工具">
    <button class="tool-btn active" data-tool="select" data-tip="选择 · V" aria-label="选择">↖</button>
    <button class="tool-btn" data-tool="pen" data-tip="画笔 · P" aria-label="画笔">✎</button>
    <button class="tool-btn" data-tool="marker" data-tip="马克笔 · M" aria-label="马克笔">▰</button>
    <button class="tool-btn" data-tool="eraser" data-tip="橡皮 · E" aria-label="橡皮">◇</button>
    <div class="tool-sep"></div>
    <button class="tool-btn" data-tool="rect" data-tip="矩形 · R" aria-label="矩形">□</button>
    <button class="tool-btn" data-tool="ellipse" data-tip="椭圆 · O" aria-label="椭圆">○</button>
    <button class="tool-btn" data-tool="line" data-tip="直线 · L" aria-label="直线">╱</button>
    <button class="tool-btn" data-tool="arrow" data-tip="箭头 · A" aria-label="箭头">→</button>
    <div class="tool-sep"></div>
    <button class="tool-btn" data-tool="note" data-tip="便签 · N" aria-label="便签">▧</button>
    <button class="tool-btn" data-tool="text" data-tip="文字 · T" aria-label="文字">T</button>
    <button class="tool-btn" data-tool="hand" data-tip="平移 · H / Alt拖动" aria-label="平移">✋</button>
  </nav>

  <!-- 正负形检查器：切换滤镜预览，不修改画板中的原始颜色数据。 -->
  <aside class="inspector glass" aria-label="正负形检查器">
    <div class="inspect-head">
      <span class="eyebrow">空间检查</span>
      <span class="live-pill" id="livePill"><i></i><span>原色</span></span>
    </div>
    <button class="space-switch" id="spaceSwitch">
      <span class="switch-copy"><span class="switch-title">反转画面</span><span class="switch-sub">再次按下恢复原色</span></span>
      <kbd>空格</kbd>
    </button>
    <div class="mode-grid" id="modeGrid">
      <button class="mode-btn active" data-mode="classic"><span class="mode-name">经典反相</span><span class="mode-desc">精准 RGB 负片</span></button>
      <button class="mode-btn" data-mode="mono"><span class="mode-name">黑白负片</span><span class="mode-desc">聚焦明度结构</span></button>
      <button class="mode-btn" data-mode="soft"><span class="mode-name">柔和负片</span><span class="mode-desc">低反差胶片感</span></button>
      <button class="mode-btn" data-mode="hard"><span class="mode-name">高反差</span><span class="mode-desc">强化形底边界</span></button>
      <button class="mode-btn" data-mode="cyan"><span class="mode-name">青橙反冲</span><span class="mode-desc">冷暖关系检查</span></button>
      <button class="mode-btn" data-mode="violet"><span class="mode-name">蓝紫反冲</span><span class="mode-desc">偏色负冲预览</span></button>
    </div>
    <div class="control-block">
      <button class="desat-btn" id="desatBtn"><span>去色检查</span><span class="toggle-dot"></span></button>
    </div>
  </aside>

  <!-- 绘制样式控制：控制新建笔画与图形的颜色、尺寸和填充。 -->
  <section class="style-panel glass" aria-label="绘制样式">
    <label class="color-wrap" title="颜色"><input id="colorPicker" type="color" value="#20231f" aria-label="绘制颜色"></label>
    <div class="width-wrap">
      <span style="font-size:9px;color:var(--muted)">细</span>
      <input id="sizeSlider" type="range" min="1" max="36" value="4" aria-label="笔触粗细">
      <span id="sizeValue">4 px</span>
    </div>
    <button class="fill-btn" id="fillBtn" title="形状填充">填充</button>
  </section>

  <!-- 视图缩放控制：中间的百分比按钮同时承担重置视图功能。 -->
  <section class="zoom-panel glass" aria-label="缩放控制">
    <button class="seg-btn" id="zoomOut" aria-label="缩小">−</button>
    <button class="seg-btn" id="zoomLabel" title="点击重置视图">100%</button>
    <button class="seg-btn" id="zoomIn" aria-label="放大">＋</button>
  </section>

  <!-- 非阻塞反馈：底部操作提示与顶部短暂消息。 -->
  <div class="hint" id="hint">拖入图片 · 滚轮缩放 · Alt 拖动画布 · 双击文字或便签可编辑</div>
  <div class="toast" id="toast"></div>

  <!-- 文字编辑控制：为文字和便签对象提供编辑、删除、取消和完成操作。 -->
  <div class="editor glass" id="editor">
    <textarea id="editorText" placeholder="输入内容…" aria-label="编辑文字"></textarea>
    <div class="editor-actions">
      <button class="action-btn delete" id="editorDelete">删除</button>
      <button class="action-btn" id="editorCancel">取消</button>
      <button class="action-btn primary" id="editorSave">完成</button>
    </div>
  </div>

  <!-- 导出控制菜单：支持当前视觉效果 PNG 与可继续编辑的 JSON。 -->
  <div class="drop-menu glass" id="exportMenu">
    <button id="exportPng">导出当前画面 · PNG</button>
    <button id="exportJson">备份可编辑画板 · JSON</button>
  </div>

  <!-- 隐藏文件选择器与拖放反馈层：同时接收图片和画板备份。 -->
  <input id="fileInput" type="file" accept="application/json,.json,image/*" multiple hidden>
  <div class="drop-zone" id="dropZone" aria-hidden="true">
    <div class="drop-card"><div class="drop-icon">＋</div><div class="drop-title">松开即可放入画板</div><div class="drop-sub">支持 JPG、PNG、WebP、GIF 等常见图片</div></div>
  </div>

  <!-- p5.js 加载失败时显示的兜底提示。 -->
  <div class="load-error" id="loadError"><div><h1>需要联网载入 p5.js</h1><p>请连接网络后重新打开这个文件。画板作品仍会保存在这台设备的浏览器中。</p></div></div>

  <script>
    (() => {
      'use strict';

      if (typeof window.p5 === 'undefined') {
        document.getElementById('loadError').style.display = 'grid';
        return;
      }

      // ===== 控制 UI 配置 =====
      // 每种负冲按钮对应一个 CSS 滤镜；名称用于右侧实时状态标签和提示消息。
      const STORAGE_KEY = 'positive-negative-freeboard-v1';
      const BOARD_BG = '#f3f1ea';
      const modeFilters = {
        classic: 'invert(1)',
        mono: 'grayscale(1) invert(1) contrast(1.12)',
        soft: 'invert(1) sepia(.18) saturate(.82) contrast(.9)',
        hard: 'grayscale(1) invert(1) contrast(1.85)',
        cyan: 'invert(1) sepia(.35) saturate(1.45) hue-rotate(150deg)',
        violet: 'invert(1) saturate(1.3) hue-rotate(35deg)'
      };
      const modeNames = { classic: '经典反相', mono: '黑白负片', soft: '柔和负片', hard: '高反差', cyan: '青橙反冲', violet: '蓝紫反冲' };
      // 工具快捷键映射：按键后交给 setTool() 统一更新工具按钮与鼠标样式。
      const shortcutTools = { v: 'select', p: 'pen', m: 'marker', e: 'eraser', r: 'rect', o: 'ellipse', l: 'line', a: 'arrow', n: 'note', t: 'text', h: 'hand' };

      // ===== 画板与 UI 共享状态 =====
      // 修改这些变量后，应调用对应的 syncUI / syncZoom / applyPreview 保持界面一致。
      let renderer;
      let items = [];
      let tool = 'select';
      let selectedId = null;
      let currentDraft = null;
      let dragState = null;
      let view = { x: window.innerWidth / 2, y: window.innerHeight / 2, zoom: 1 };
      let style = { color: '#20231f', size: 4, fill: false };
      let negativeOn = false;
      let negativeMode = 'classic';
      let desaturated = false;
      let history = [];
      let historyIndex = -1;
      let editingId = null;
      let toastTimer;
      let saveTimer;
      const imageCache = new Map();
      const loadingImages = new Set();

      // UI 查询快捷方法：$ 取一个元素，$$ 取一组元素并转成可遍历数组。
      const $ = (s) => document.querySelector(s);
      const $$ = (s) => [...document.querySelectorAll(s)];
      const uid = () => 'o_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
      const clone = (value) => JSON.parse(JSON.stringify(value));
      const isTyping = () => ['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName);

      function screenToWorld(sx, sy) { return { x: (sx - view.x) / view.zoom, y: (sy - view.y) / view.zoom }; }
      function worldToScreen(x, y) { return { x: x * view.zoom + view.x, y: y * view.zoom + view.y }; }
      function normalizedRect(a, b) { return { x: Math.min(a.x,b.x), y: Math.min(a.y,b.y), w: Math.abs(b.x-a.x), h: Math.abs(b.y-a.y) }; }
      function hexToRgb(hex) {
        const n = parseInt(hex.replace('#',''), 16);
        return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
      }

      // ===== p5.js 初始化与渲染 =====
      // 初始化时挂载画布、读取本地数据，并让所有控制 UI 显示当前状态。
      function setupBoard() {
        renderer = createCanvas(windowWidth, windowHeight);
        renderer.parent('canvas-shell');
        pixelDensity(Math.min(2, window.devicePixelRatio || 1));
        renderer.elt.setAttribute('aria-label', '可绘制的无限画布');
        renderer.elt.addEventListener('contextmenu', (e) => e.preventDefault());
        loadLocal();
        if (!history.length) pushHistory();
        syncUI();
      }

      window.setup = setupBoard;
      window.draw = function() {
        clear();
        background(BOARD_BG);
        drawGrid();
        push();
        translate(view.x, view.y);
        scale(view.zoom);
        for (const item of items) drawItem(item);
        if (currentDraft) drawItem(currentDraft, true);
        if (selectedId) drawSelection(items.find(i => i.id === selectedId));
        pop();
      };

      function drawGrid() {
        const minor = 24 * view.zoom;
        if (minor < 9) return;
        const ox = ((view.x % minor) + minor) % minor;
        const oy = ((view.y % minor) + minor) % minor;
        stroke(32, 35, 31, minor > 18 ? 17 : 11);
        strokeWeight(1);
        for (let x = ox; x < width; x += minor) line(x, 0, x, height);
        for (let y = oy; y < height; y += minor) line(0, y, width, y);
        const major = minor * 5;
        const mx = ((view.x % major) + major) % major;
        const my = ((view.y % major) + major) % major;
        stroke(32, 35, 31, 23);
        for (let x = mx; x < width; x += major) line(x, 0, x, height);
        for (let y = my; y < height; y += major) line(0, y, width, y);
      }

      function setStroke(hex, alpha = 255, weight = 2) {
        const c = color(hex);
        c.setAlpha(alpha);
        stroke(c);
        strokeWeight(weight);
        strokeCap(ROUND);
        strokeJoin(ROUND);
      }

      function drawItem(o) {
        if (!o) return;
        push();
        if (o.type === 'image') {
          const cached = imageCache.get(o.id);
          if (cached) {
            drawingContext.save();
            drawingContext.shadowColor = 'rgba(20,25,20,.12)';
            drawingContext.shadowBlur = 14;
            drawingContext.shadowOffsetY = 5;
            image(cached,o.x,o.y,o.w,o.h);
            drawingContext.restore();
            noFill(); stroke(32,35,31,24); strokeWeight(1/view.zoom); rect(o.x,o.y,o.w,o.h,3/view.zoom);
          } else {
            queueImage(o);
            noStroke(); fill('#e7e5de'); rect(o.x,o.y,o.w,o.h,8);
            fill(32,35,31,90); textAlign(CENTER,CENTER); textSize(12/view.zoom); text('正在载入图片…',o.x+o.w/2,o.y+o.h/2);
          }
        } else if (o.type === 'stroke') {
          const alpha = o.kind === 'marker' ? 90 : 255;
          setStroke(o.kind === 'eraser' ? BOARD_BG : o.color, alpha, o.width);
          noFill();
          beginShape();
          for (const pt of o.points) curveVertex(pt.x, pt.y);
          if (o.points.length === 1) point(o.points[0].x, o.points[0].y);
          endShape();
        } else if (['rect','ellipse','line','arrow'].includes(o.type)) {
          setStroke(o.color, 255, o.width);
          if (o.fill && !['line','arrow'].includes(o.type)) {
            const fc = color(o.color); fc.setAlpha(42); fill(fc);
          } else noFill();
          if (o.type === 'rect') {
            const r = normalizedRect(o.a,o.b); rect(r.x,r.y,r.w,r.h, Math.min(14, r.w/5, r.h/5));
          } else if (o.type === 'ellipse') {
            const r = normalizedRect(o.a,o.b); ellipse(r.x+r.w/2,r.y+r.h/2,r.w,r.h);
          } else {
            line(o.a.x,o.a.y,o.b.x,o.b.y);
            if (o.type === 'arrow') drawArrowHead(o.a,o.b,o.width,o.color);
          }
        } else if (o.type === 'note') {
          drawingContext.save();
          drawingContext.shadowColor = 'rgba(20,25,20,.12)';
          drawingContext.shadowBlur = 15;
          drawingContext.shadowOffsetY = 5;
          noStroke(); fill(o.color || '#fff2a8');
          rect(o.x,o.y,o.w,o.h,10);
          drawingContext.restore();
          fill('#20231f'); noStroke(); textFont('Inter, sans-serif'); textSize(15); textLeading(21); textAlign(LEFT,TOP);
          text(o.text || '双击编辑便签', o.x+14,o.y+14,o.w-28,o.h-28);
        } else if (o.type === 'text') {
          noStroke(); fill(o.color); textFont('Inter, sans-serif'); textSize(o.size || 22); textLeading((o.size || 22)*1.35); textAlign(LEFT,TOP);
          text(o.text || '双击编辑文字',o.x,o.y,Math.max(160,o.w || 260));
        }
        pop();
      }

      function drawArrowHead(a,b,w,hex) {
        const angle = Math.atan2(b.y-a.y,b.x-a.x);
        const len = Math.max(11, w*3.5);
        setStroke(hex,255,w);
        line(b.x,b.y,b.x-len*Math.cos(angle-.5),b.y-len*Math.sin(angle-.5));
        line(b.x,b.y,b.x-len*Math.cos(angle+.5),b.y-len*Math.sin(angle+.5));
      }

      function getBounds(o) {
        if (!o) return null;
        if (o.type === 'image') return {x:o.x,y:o.y,w:o.w,h:o.h};
        if (o.type === 'stroke') {
          const xs = o.points.map(p=>p.x), ys = o.points.map(p=>p.y);
          return { x: Math.min(...xs), y: Math.min(...ys), w: Math.max(1,Math.max(...xs)-Math.min(...xs)), h: Math.max(1,Math.max(...ys)-Math.min(...ys)) };
        }
        if (['rect','ellipse','line','arrow'].includes(o.type)) return normalizedRect(o.a,o.b);
        if (o.type === 'note') return {x:o.x,y:o.y,w:o.w,h:o.h};
        if (o.type === 'text') return {x:o.x,y:o.y,w:o.w || 260,h:Math.max(35,(o.text.split('\n').length)*(o.size||22)*1.35)};
        return null;
      }

      function drawSelection(o) {
        const b = getBounds(o); if (!b) return;
        const pad = 7 / view.zoom;
        push();
        noFill(); stroke('#ff5a3d'); strokeWeight(1.5/view.zoom); drawingContext.setLineDash([6/view.zoom,4/view.zoom]);
        rect(b.x-pad,b.y-pad,b.w+pad*2,b.h+pad*2,5/view.zoom);
        drawingContext.setLineDash([]);
        for (const p of [[b.x-pad,b.y-pad],[b.x+b.w+pad,b.y-pad],[b.x-pad,b.y+b.h+pad],[b.x+b.w+pad,b.y+b.h+pad]]) {
          fill('#fff'); stroke('#ff5a3d'); circle(p[0],p[1],7/view.zoom);
        }
        pop();
      }

      function hitTest(p) {
        const tolerance = 10 / view.zoom;
        for (let i=items.length-1;i>=0;i--) {
          const o=items[i], b=getBounds(o); if (!b) continue;
          if (p.x>=b.x-tolerance && p.x<=b.x+b.w+tolerance && p.y>=b.y-tolerance && p.y<=b.y+b.h+tolerance) return o;
        }
        return null;
      }

      // ===== 画布指针交互 =====
      // p5 的鼠标事件负责绘制、选择、移动和平移；UI 元素自身不会进入这些处理器。
      window.mousePressed = function(event) {
        if (!renderer || event.target !== renderer.elt) return;
        closeExportMenu();
        if ($('#editor').classList.contains('open')) saveEditor();
        const p = screenToWorld(mouseX,mouseY);
        const panGesture = tool === 'hand' || event.altKey || event.button === 1 || event.button === 2;
        if (panGesture) {
          dragState = { kind:'pan', sx:mouseX, sy:mouseY, vx:view.x, vy:view.y };
          return false;
        }
        if (tool === 'select') {
          const hit = hitTest(p);
          selectedId = hit?.id || null;
          dragState = hit ? {kind:'move', id:hit.id, start:p, moved:false} : null;
          syncUI(); return false;
        }
        if (['pen','marker','eraser'].includes(tool)) {
          currentDraft = {id:uid(),type:'stroke',kind:tool,color:style.color,width:tool==='marker'?style.size*3:tool==='eraser'?style.size*4:style.size,points:[p]};
        } else if (['rect','ellipse','line','arrow'].includes(tool)) {
          currentDraft = {id:uid(),type:tool,a:p,b:clone(p),color:style.color,width:style.size,fill:style.fill};
        } else if (tool === 'note') {
          const note = {id:uid(),type:'note',x:p.x,y:p.y,w:190,h:150,text:'写下想法…',color:'#fff1a8'};
          items.push(note); selectedId=note.id; pushHistory(); openEditor(note);
        } else if (tool === 'text') {
          const txt = {id:uid(),type:'text',x:p.x,y:p.y,w:280,text:'输入文字',color:style.color,size:Math.max(18,style.size*4)};
          items.push(txt); selectedId=txt.id; pushHistory(); openEditor(txt);
        }
        return false;
      };

      window.mouseDragged = function(event) {
        if (!renderer || event.target !== renderer.elt) return;
        const p = screenToWorld(mouseX,mouseY);
        if (dragState?.kind === 'pan') {
          view.x = dragState.vx + mouseX-dragState.sx; view.y = dragState.vy + mouseY-dragState.sy; syncZoom();
        } else if (dragState?.kind === 'move') {
          const o=items.find(i=>i.id===dragState.id); if (!o) return;
          const dx=p.x-dragState.start.x, dy=p.y-dragState.start.y;
          translateItem(o,dx,dy); dragState.start=p; dragState.moved=true;
        } else if (currentDraft?.type === 'stroke') {
          const last=currentDraft.points.at(-1);
          if (dist(last.x,last.y,p.x,p.y)>1.2/view.zoom) currentDraft.points.push(p);
        } else if (currentDraft) currentDraft.b=p;
        return false;
      };

      window.mouseReleased = function(event) {
        if (!renderer || event.target !== renderer.elt) return;
        if (currentDraft) {
          const b=getBounds(currentDraft);
          if (currentDraft.type==='stroke' || b.w+b.h>2/view.zoom) items.push(currentDraft);
          currentDraft=null; pushHistory();
        }
        if (dragState?.kind==='move' && dragState.moved) pushHistory();
        dragState=null; return false;
      };

      window.doubleClicked = function(event) {
        if (!renderer || event.target !== renderer.elt) return;
        const hit=hitTest(screenToWorld(mouseX,mouseY));
        if (hit && ['note','text'].includes(hit.type)) { selectedId=hit.id; openEditor(hit); return false; }
      };

      window.mouseWheel = function(event) {
        if (!renderer || event.target !== renderer.elt) return;
        const old=view.zoom;
        const factor=Math.exp(-event.delta*0.0012);
        const next=constrain(old*factor,.2,4);
        const wx=(mouseX-view.x)/old, wy=(mouseY-view.y)/old;
        view.x=mouseX-wx*next; view.y=mouseY-wy*next; view.zoom=next; syncZoom();
        return false;
      };

      window.windowResized = function() { resizeCanvas(windowWidth,windowHeight); };

      function translateItem(o,dx,dy) {
        if (o.type==='stroke') o.points.forEach(p=>{p.x+=dx;p.y+=dy;});
        else if (['rect','ellipse','line','arrow'].includes(o.type)) {o.a.x+=dx;o.a.y+=dy;o.b.x+=dx;o.b.y+=dy;}
        else {o.x+=dx;o.y+=dy;}
      }

      // ===== 图片导入控制 =====
      // 图片先压缩并缓存，再作为普通画板对象加入；因此可选择、移动、撤销和导出。
      function queueImage(o) {
        if (!o?.src || imageCache.has(o.id) || loadingImages.has(o.id)) return;
        loadingImages.add(o.id);
        loadImage(o.src,
          img=>{imageCache.set(o.id,img);loadingImages.delete(o.id);},
          ()=>{loadingImages.delete(o.id);}
        );
      }

      function readFileAsDataURL(file) {
        return new Promise((resolve,reject)=>{
          const reader=new FileReader(); reader.onload=()=>resolve(reader.result); reader.onerror=reject; reader.readAsDataURL(file);
        });
      }

      function loadNativeImage(src) {
        return new Promise((resolve,reject)=>{
          const img=new Image(); img.onload=()=>resolve(img); img.onerror=reject; img.src=src;
        });
      }

      async function prepareImageFile(file) {
        const original=await readFileAsDataURL(file);
        const source=await loadNativeImage(original);
        const naturalW=source.naturalWidth||source.width, naturalH=source.naturalHeight||source.height;
        const maxSource=1600, scale=Math.min(1,maxSource/Math.max(naturalW,naturalH));
        const out=document.createElement('canvas'); out.width=Math.max(1,Math.round(naturalW*scale)); out.height=Math.max(1,Math.round(naturalH*scale));
        const ctx=out.getContext('2d'); ctx.drawImage(source,0,0,out.width,out.height);
        let src=out.toDataURL('image/webp',.9);
        if(!src.startsWith('data:image/webp')) src=out.toDataURL('image/png');
        const fit=Math.min(1,640/naturalW,480/naturalH);
        return {src,naturalW,naturalH,w:Math.max(48,naturalW*fit),h:Math.max(48,naturalH*fit)};
      }

      async function importImageFiles(files,sx=window.innerWidth/2,sy=window.innerHeight/2) {
        const images=[...files].filter(file=>file.type.startsWith('image/'));
        if(!images.length) return false;
        showToast(`正在导入 ${images.length} 张图片…`);
        const anchor=screenToWorld(sx,sy);
        let imported=0;
        for(const file of images){
          try{
            const data=await prepareImageFile(file), offset=imported*24/view.zoom;
            const item={id:uid(),type:'image',name:file.name,src:data.src,x:anchor.x-data.w/2+offset,y:anchor.y-data.h/2+offset,w:data.w,h:data.h};
            items.push(item); selectedId=item.id; queueImage(item); imported++;
          }catch(err){console.warn('图片导入失败',file.name,err);}
        }
        if(imported){pushHistory();setTool('select');showToast(imported===1?'图片已放入画板':`${imported} 张图片已放入画板`);}
        else showToast('没有可导入的图片');
        return imported>0;
      }

      async function importBoardFile(file) {
        const data=JSON.parse(await file.text());
        if(!Array.isArray(data.items)) throw new Error('invalid board');
        items=data.items; view=data.view||view; style={...style,...(data.style||{})}; selectedId=null;
        imageCache.clear(); loadingImages.clear(); pushHistory(); syncUI(); showToast('画板已导入');
      }

      async function handleIncomingFiles(fileList,sx,sy) {
        const files=[...fileList];
        const board=files.find(file=>file.type==='application/json'||file.name.toLowerCase().endsWith('.json'));
        try {
          if(board) await importBoardFile(board);
          await importImageFiles(files,sx,sy);
        } catch(err) {
          console.warn('文件导入失败',err); alert('文件无法导入，请确认它是图片或有效的画板备份。');
        }
      }

      // ===== 左侧工具栏控制 =====
      // 集中更新当前工具、按钮 active 状态、画布鼠标指针与底部操作提示。
      function setTool(next) {
        tool=next; currentDraft=null;
        $$('.tool-btn').forEach(b=>b.classList.toggle('active',b.dataset.tool===tool));
        const cursors={select:'default',pen:'crosshair',marker:'crosshair',eraser:'cell',rect:'crosshair',ellipse:'crosshair',line:'crosshair',arrow:'crosshair',note:'copy',text:'text',hand:'grab'};
        if (renderer) renderer.elt.style.cursor=cursors[tool];
        $('#hint').style.opacity='0'; setTimeout(()=>$('#hint').style.opacity='1',500);
      }

      // ===== 右侧空间检查器控制 =====
      // toggleNegative 管理总开关；applyPreview 同时刷新 canvas 滤镜和检查器按钮状态。
      function toggleNegative(force) {
        negativeOn=typeof force==='boolean'?force:!negativeOn; applyPreview();
        showToast(negativeOn ? `已开启 · ${modeNames[negativeMode]}` : '已恢复原色');
      }

      function applyPreview() {
        if (!renderer) return;
        const parts=[];
        if (desaturated && !(negativeOn && ['mono','hard'].includes(negativeMode))) parts.push('grayscale(1)');
        if (negativeOn) parts.push(modeFilters[negativeMode]);
        renderer.elt.style.filter=parts.join(' ') || 'none';
        $('#spaceSwitch').classList.toggle('on',negativeOn);
        $('#livePill').classList.toggle('on',negativeOn || desaturated);
        $('#livePill span').textContent=negativeOn?modeNames[negativeMode]:(desaturated?'已去色':'原色');
        $('#desatBtn').classList.toggle('on',desaturated);
        $$('.mode-btn').forEach(b=>b.classList.toggle('active',b.dataset.mode===negativeMode));
      }

      // 顶部短暂反馈消息；重复操作会重置隐藏计时，避免消息互相覆盖。
      function showToast(message) {
        const el=$('#toast'); el.textContent=message; el.classList.add('show');
        clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),1300);
      }

      // ===== 顶部历史与自动保存控制 =====
      // 历史记录驱动撤销/重做按钮；本地保存采用短延迟合并连续更新。
      function serialize() { return JSON.stringify({version:1,items,view,style}); }
      function pushHistory() {
        const state=serialize();
        if (history[historyIndex]===state) return;
        history=history.slice(0,historyIndex+1); history.push(state);
        if (history.length>80) history.shift(); else historyIndex++;
        queueSave(); updateUndoRedo();
      }
      function restoreHistory(index) {
        if (index<0 || index>=history.length) return;
        historyIndex=index; const data=JSON.parse(history[index]);
        items=data.items||[]; view=data.view||view; style={...style,...(data.style||{})}; selectedId=null;
        syncUI(); queueSave(); updateUndoRedo();
      }
      function undo() { restoreHistory(historyIndex-1); }
      function redo() { restoreHistory(historyIndex+1); }
      function updateUndoRedo() { $('#undoBtn').disabled=historyIndex<=0; $('#redoBtn').disabled=historyIndex>=history.length-1; }
      function queueSave() {
        $('#saveText').textContent='正在保存…'; clearTimeout(saveTimer);
        saveTimer=setTimeout(()=>{ try {localStorage.setItem(STORAGE_KEY,serialize()); $('#saveText').textContent='已自动保存';} catch(e){$('#saveText').textContent='仅本次有效';} },260);
      }
      function loadLocal() {
        try {
          const raw=localStorage.getItem(STORAGE_KEY); if (!raw) return;
          const data=JSON.parse(raw); items=data.items||[]; view=data.view||view; style={...style,...(data.style||{})};
        } catch(e) { console.warn('无法读取本地画板',e); }
      }

      // ===== 控制 UI 状态同步 =====
      // 从数据状态反向刷新颜色、粗细、填充、工具、缩放、滤镜和历史按钮。
      function syncUI() {
        $('#colorPicker').value=style.color; $('#sizeSlider').value=style.size; $('#sizeValue').textContent=`${style.size} px`;
        $('#fillBtn').classList.toggle('active',style.fill); setTool(tool); syncZoom(); applyPreview(); updateUndoRedo();
      }
      function syncZoom() { $('#zoomLabel').textContent=`${Math.round(view.zoom*100)}%`; }
      function zoomAtCenter(factor) {
        const cx=windowWidth/2, cy=windowHeight/2, old=view.zoom, next=constrain(old*factor,.2,4);
        const wx=(cx-view.x)/old, wy=(cy-view.y)/old; view.x=cx-wx*next; view.y=cy-wy*next; view.zoom=next; syncZoom();
      }
      function resetView() { view={x:windowWidth/2,y:windowHeight/2,zoom:1}; syncZoom(); }

      // ===== 文字/便签编辑浮层控制 =====
      // 浮层定位在对象附近；完成后写回对象并创建一条可撤销历史。
      function openEditor(item) {
        editingId=item.id; const e=$('#editor'), s=worldToScreen(item.x,item.y);
        $('#editorText').value=item.text||'';
        e.style.left=`${Math.min(window.innerWidth-298,Math.max(84,s.x+16))}px`;
        e.style.top=`${Math.min(window.innerHeight-190,Math.max(92,s.y+16))}px`;
        e.classList.add('open'); setTimeout(()=>{$('#editorText').focus();$('#editorText').select();},20);
      }
      function closeEditor() { $('#editor').classList.remove('open'); editingId=null; }
      function saveEditor() {
        const item=items.find(i=>i.id===editingId); if (item) {item.text=$('#editorText').value.trim()||'无标题'; pushHistory();}
        closeEditor();
      }
      function deleteEditing() { if(editingId){items=items.filter(i=>i.id!==editingId);selectedId=null;pushHistory();}closeEditor(); }

      function deleteSelected() {
        if (!selectedId) return; items=items.filter(i=>i.id!==selectedId);selectedId=null;pushHistory();showToast('已删除所选内容');
      }

      // ===== 导入/导出菜单控制 =====
      // PNG 保留当前检查效果；JSON 保留对象、视图和样式，便于之后继续编辑。
      function download(name,href) { const a=document.createElement('a');a.download=name;a.href=href;document.body.appendChild(a);a.click();a.remove(); }
      function exportJson() {
        const blob=new Blob([JSON.stringify({version:1,createdAt:new Date().toISOString(),items,view,style},null,2)],{type:'application/json'});
        download(`正负形画板-${dateStamp()}.json`,URL.createObjectURL(blob)); closeExportMenu(); showToast('可编辑画板已导出');
      }
      function exportPng() {
        const src=renderer.elt, out=document.createElement('canvas'); out.width=src.width;out.height=src.height;
        const ctx=out.getContext('2d');ctx.drawImage(src,0,0);
        if (negativeOn || desaturated) transformPixels(ctx,out.width,out.height);
        download(`正负形画板-${dateStamp()}.png`,out.toDataURL('image/png'));closeExportMenu();showToast('当前画面已导出');
      }
      function transformPixels(ctx,w,h) {
        const img=ctx.getImageData(0,0,w,h), d=img.data;
        for(let i=0;i<d.length;i+=4){
          let r=d[i],g=d[i+1],b=d[i+2];
          if(desaturated || (negativeOn&&['mono','hard'].includes(negativeMode))){const y=.2126*r+.7152*g+.0722*b;r=g=b=y;}
          if(negativeOn){
            r=255-r;g=255-g;b=255-b;
            if(negativeMode==='soft'){r=128+(r-128)*.9;g=128+(g-128)*.9;b=128+(b-128)*.9;r=r*1.03+5;g=g*.98+3;b=b*.9;}
            if(negativeMode==='hard'){r=(r-128)*1.85+128;g=(g-128)*1.85+128;b=(b-128)*1.85+128;}
            if(negativeMode==='cyan'){const nr=.35*r+.45*g+.2*b,ng=.15*r+.65*g+.2*b,nb=.1*r+.38*g+.72*b;r=nr;g=ng;b=nb;}
            if(negativeMode==='violet'){const nr=.62*r+.1*g+.35*b,ng=.05*r+.8*g+.12*b,nb=.18*r+.12*g+.82*b;r=nr;g=ng;b=nb;}
          }
          d[i]=Math.max(0,Math.min(255,r));d[i+1]=Math.max(0,Math.min(255,g));d[i+2]=Math.max(0,Math.min(255,b));
        }
        ctx.putImageData(img,0,0);
      }
      function dateStamp(){const d=new Date();return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;}
      function closeExportMenu(){$('#exportMenu').classList.remove('open');}

      // ===== 控制 UI 事件绑定：工具与空间检查 =====
      $$('.tool-btn').forEach(b=>b.addEventListener('click',()=>setTool(b.dataset.tool)));
      $$('.mode-btn').forEach(b=>b.addEventListener('click',()=>{negativeMode=b.dataset.mode;toggleNegative(true);}));
      $('#spaceSwitch').addEventListener('click',()=>toggleNegative());
      $('#desatBtn').addEventListener('click',()=>{desaturated=!desaturated;applyPreview();showToast(desaturated?'已开启去色检查':'已恢复色彩');});

      // ===== 控制 UI 事件绑定：绘制样式 =====
      // input 事件提供即时预览，change 事件在操作完成后写入历史。
      $('#colorPicker').addEventListener('input',e=>style.color=e.target.value);
      $('#colorPicker').addEventListener('change',()=>pushHistory());
      $('#sizeSlider').addEventListener('input',e=>{style.size=Number(e.target.value);$('#sizeValue').textContent=`${style.size} px`;});
      $('#sizeSlider').addEventListener('change',()=>pushHistory());
      $('#fillBtn').addEventListener('click',()=>{style.fill=!style.fill;$('#fillBtn').classList.toggle('active',style.fill);pushHistory();});

      // ===== 控制 UI 事件绑定：顶部栏与缩放 =====
      $('#undoBtn').addEventListener('click',undo); $('#redoBtn').addEventListener('click',redo);
      $('#clearBtn').addEventListener('click',()=>{if(items.length&&confirm('确定清空整张画板吗？可立即使用撤销恢复。')){items=[];selectedId=null;pushHistory();showToast('画板已清空');}});
      $('#zoomOut').addEventListener('click',()=>zoomAtCenter(.8)); $('#zoomIn').addEventListener('click',()=>zoomAtCenter(1.25)); $('#zoomLabel').addEventListener('click',resetView);

      // ===== 控制 UI 事件绑定：导入、导出和编辑浮层 =====
      $('#exportBtn').addEventListener('click',e=>{e.stopPropagation();$('#exportMenu').classList.toggle('open');});
      $('#exportPng').addEventListener('click',exportPng); $('#exportJson').addEventListener('click',exportJson);
      $('#importBtn').addEventListener('click',()=>$('#fileInput').click());
      $('#fileInput').addEventListener('change',async e=>{if(e.target.files.length)await handleIncomingFiles(e.target.files);e.target.value='';});
      $('#editorSave').addEventListener('click',saveEditor); $('#editorCancel').addEventListener('click',closeEditor); $('#editorDelete').addEventListener('click',deleteEditing);
      // 点击导出菜单以外的区域时自动收起菜单。
      document.addEventListener('pointerdown',e=>{if(!e.target.closest('#exportMenu')&&!e.target.closest('#exportBtn'))closeExportMenu();});

      // ===== 控制 UI 事件绑定：文件拖放遮罩 =====
      // 文件进入时显示遮罩，离开/投放/窗口失焦时统一隐藏。
      document.addEventListener('dragover',e=>{
        if([...e.dataTransfer.types].includes('Files')){e.preventDefault();e.dataTransfer.dropEffect='copy';$('#dropZone').classList.add('show');}
      });
      document.addEventListener('dragleave',e=>{if(!e.relatedTarget||e.clientX<=0||e.clientY<=0||e.clientX>=window.innerWidth||e.clientY>=window.innerHeight)$('#dropZone').classList.remove('show');});
      document.addEventListener('drop',async e=>{
        e.preventDefault();$('#dropZone').classList.remove('show');
        if(e.dataTransfer.files.length)await handleIncomingFiles(e.dataTransfer.files,e.clientX,e.clientY);
      });
      window.addEventListener('blur',()=>$('#dropZone').classList.remove('show'));

      // ===== 全局键盘控制 =====
      // 编辑文字时仅保留编辑快捷键；其他情况下处理反相、历史、删除和工具切换。
      document.addEventListener('keydown',e=>{
        if (isTyping()) {
          if(e.key==='Escape')closeEditor();
          if((e.metaKey||e.ctrlKey)&&e.key==='Enter')saveEditor();
          return;
        }
        if(e.code==='Space'&&!e.repeat){e.preventDefault();toggleNegative();return;}
        if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();return;}
        if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='y'){e.preventDefault();redo();return;}
        if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();deleteSelected();return;}
        if(e.key==='Escape'){selectedId=null;currentDraft=null;closeEditor();return;}
        const mapped=shortcutTools[e.key.toLowerCase()];if(mapped)setTool(mapped);
      });
    })();
  </script>
</body>
</html>
