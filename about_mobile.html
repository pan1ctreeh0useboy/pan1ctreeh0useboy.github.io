<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>ENTER L0BBY</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: black;
    }

    .wrap {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .box {
      width: 80vw;
      height: 80vh;
      position: relative;
      background: transparent;
    }

    .label {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      font-family: 'Inconsolata', monospace;
      font-size: 16pt;
      line-height: 16pt;
      color: #fff;
      white-space: nowrap;
    }

    .description {
      white-space: normal;
      padding: 2px 0;
    }

    .about { margin-bottom: 11.2pt; }

    .design-title {
      width: max-content;
      font-size: calc(80vw / var(--title-width-in-em, 16.8));
      line-height: 1;
      margin-bottom: 0.85em;
    }

    .back-link {
      position: absolute;
      bottom: 0;
      left: 0;
      font-family: 'Inconsolata', monospace;
      font-size: 16pt;
      color: #fff;
      text-decoration: none;
    }
    .back-link:hover { text-decoration: underline; }

    .gif-container {
      width: var(--last-line-width, 0px);
      height: 14pt;
      overflow: hidden;
    }
    .gif-container img {
      height: 100%;
      width: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="box">
      <div class="label">
        <div class="about">ABOUT</div>
        <div class="design-title">Motion design/Graphic design</div>
        <div class="description">The only way you can learn about me is by engaging with my works.</div>
        <div class="gif-container">
          <img src="l05.gif" alt="l05 animation" width="532" height="24" fetchpriority="high" />
        </div>
      </div>
      <a class="back-link" href="pan1ctreeh0useboy.github.io/mobile.html">Back</a>
    </div>
  </div>

  <script>
    (() => {
      const title = document.querySelector('.design-title');
      const description = document.querySelector('.description');
      const gif = document.querySelector('.gif-container');

      // 标题只测一次字宽，之后由 CSS 随视口缩放。
      const titleFontSize = parseFloat(getComputedStyle(title).fontSize);
      const titleWidthInEm = title.getBoundingClientRect().width / titleFontSize;
      title.style.setProperty('--title-width-in-em', titleWidthInEm);

      const range = document.createRange();
      range.selectNodeContents(description);

      function fitGifToLastLine() {
        const lines = range.getClientRects();
        const lastLine = lines[lines.length - 1];
        if (lastLine) gif.style.setProperty('--last-line-width', `${lastLine.width}px`);
      }

      fitGifToLastLine();
      window.addEventListener('resize', fitGifToLastLine);
    })();
  </script>
</body>
</html>
