<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Projects — Upload</title>
  <link rel="stylesheet" crossorigin href="/assets/project-nlTTrzgI.css">
  <link rel="stylesheet" crossorigin href="/assets/admin-BlrfsNgY.css">
  <script type="module" src="/projects/admin.js"></script>
</head>
<body>
  <main class="wrap"><section class="box admin-box">
    <div class="admin-heading"><h1 class="label">Projects</h1><a href="/projects_mobile.html">Back</a></div>
    <form id="login-form" class="admin-form">
      <label>Password<input name="password" type="password" autocomplete="current-password" required maxlength="200" autofocus /></label>
      <button type="submit">Enter</button>
    </form>
    <section id="editor" hidden>
      <form id="project-form" class="admin-form">
        <label>Project<select name="project"></select></label>
        <label>Project title<input name="title" required maxlength="160" /></label>
        <label>Project date<input name="date" type="date" required /></label>
        <label>Work type<input name="type" required maxlength="100" /></label>
        <label>Display format<select name="format" required></select></label>
        <label>Source images<input name="images" type="file" accept="image/jpeg,image/png,image/webp" multiple /></label>
        <p class="admin-note">JPEG, PNG or WebP. The first image is the cover when provided. Choosing files replaces the current images.</p>
        <label>Source video<input name="video" type="file" accept=".mp4,video/mp4" /></label>
        <p class="admin-note">One MP4 per project. Select a file to replace the existing video. Video-only projects use a frame as the cover. Each file can be up to 24 MB, with 25 MB total per save.</p>
        <ul id="current-images" class="published-files"></ul>
        <label>Behance<input name="behance" type="url" maxlength="2048" /></label>
        <label>Vimeo<input name="vimeo" type="url" maxlength="2048" /></label>
        <label>YouTube<input name="youtube" type="url" maxlength="2048" /></label>
        <label>Bilibili<input name="bilibili" type="url" maxlength="2048" /></label>
        <button type="submit">Publish</button>
      </form>
      <button type="button" id="logout" class="logout">Sign out</button>
    </section>
    <p id="admin-status" role="status" aria-live="polite"></p>
  </section></main>
</body>
</html>
