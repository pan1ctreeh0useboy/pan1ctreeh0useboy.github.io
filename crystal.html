<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<title>Minecraft End Portal</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>

<style>

html,body{
    margin:0;
    padding:0;
    overflow:hidden;
    background:#000;
}

canvas{
    display:block;
}

#info{
    position:fixed;
    top:20px;
    left:20px;
    color:white;
    font-family:monospace;
    opacity:.6;
    z-index:10;
}

</style>

</head>


<body>

<div id="info">
CLICK → mouse control<br>
DRAG → look around
</div>


<script>


let portal;


let rotX=0;
let rotY=0;


let dragging=false;

let lastX=0;
let lastY=0;



function preload(){

    portal=loadImage(
        "111.png"
    );

}



function setup(){

    createCanvas(
        windowWidth,
        windowHeight,
        WEBGL
    );

    imageMode(CENTER);

}



function draw(){

    background(0);


    // camera rotation

    rotateX(rotX);

    rotateY(rotY);



    // portal depth layers

    for(let i=35;i>=0;i--){


        push();



        // depth

        translate(
            0,
            0,
            -i*18
        );



        // shrinking perspective

        let scaleValue=
        map(
            i,
            0,
            35,
            1.5,
            0.15
        );



        scale(
            scaleValue
        );



        // rotating galaxy

        rotateZ(
            frameCount*0.003
            +
            i*0.12
        );



        // transparency

        tint(
            255,
            map(
                i,
                0,
                35,
                20,
                160
            )
        );



        image(
            portal,
            0,
            0,
            700,
            700
        );



        pop();

    }



    noTint();



    // purple portal edge glow

    stroke(
        130,
        70,
        255,
        100
    );

    noFill();

    strokeWeight(3);

    ellipse(
        0,
        0,
        720,
        720
    );


}




function mousePressed(){

dragging=true;

lastX=mouseX;
lastY=mouseY;

}



function mouseReleased(){

dragging=false;

}



function mouseDragged(){

if(dragging){

rotY +=
(mouseX-lastX)*0.006;


rotX +=
(mouseY-lastY)*0.006;


lastX=mouseX;
lastY=mouseY;

}

}



function windowResized(){

resizeCanvas(
windowWidth,
windowHeight
);

}


</script>


</body>
</html>
