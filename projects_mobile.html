<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>!Projects!</title>
  <link rel="preload" href="/projects/catalog.json" as="fetch" crossorigin>
  <link rel="modulepreload" href="/projects/catalog.js?v=fast-feed">
  <link rel="modulepreload" href="/projects/layout.js">
  <link rel="modulepreload" href="/projects/formats.js">
  <link rel="stylesheet" href="/projects/mobile.css" />
  <style>
    .wrap { height: auto; min-height: 100vh; align-items: flex-start; }
    .box { height: auto; min-height: 80vh; margin: 10vh 0; }
    .project-band { position: relative; width: 100%; }
    .project-cover { position: absolute; display: block; }
    .project-cover img, .project-cover video {
      position: absolute;
      inset: 5%;
      width: 90%;
      height: 90%;
      object-fit: contain;
      display: block;
    }
    .project-cover video, .project-cover .preview-animation { pointer-events: none; }
    .project-cover .preview-animation { z-index: 1; }
    .project-cover .preview-animation[hidden] { display: none; }
    .project-cover.preview-playing video { z-index: 1; }
  </style>
  <script type="module" src="/projects/mobile.js?v=homepage-cards"></script>
</head>
<body>
  <div class="wrap">
    <main class="box">
      <div class="label">Projects</div>
      <div id="projects-feed"></div>
    </main>
  </div>
</body>
</html>
