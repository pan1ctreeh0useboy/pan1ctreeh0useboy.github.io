<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>!Projects!</title>
  <link rel="stylesheet" href="/projects/mobile.css" />
  <style>
    .wrap { height: auto; min-height: 100vh; align-items: flex-start; }
    .box { height: auto; min-height: 80vh; margin: 10vh 0; }
    .project-band { position: relative; width: 100%; }
    .project-cover { position: absolute; display: block; }
    .project-cover img {
      position: absolute;
      inset: 5%;
      width: 90%;
      height: 90%;
      object-fit: contain;
      display: block;
    }
  </style>
  <script type="module" src="/projects/mobile.js"></script>
</head>
<body>
  <div class="wrap">
    <main class="box">
      <div class="label">Projects</div>
      <div id="projects-feed"></div>
    </main>
  </div>
</body>
</html>
